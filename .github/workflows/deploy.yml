name: Deploy Discord Bot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inject Private Configuration
        run: |
          # Copy all .env variations (.env, .env.local, .env.production, etc.)
          cp /home/runner/bot-secrets/.env* ./ 2>/dev/null || true
          cp /home/runner/bot-secrets/rowdyraider.json rowdyraider.json

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --ignore-scripts

      - name: Start or restart bot with PM2
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          pm2 restart esports-bot || pm2 start "bun run dev" --name esports-bot
